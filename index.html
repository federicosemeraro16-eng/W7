<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <link rel="stylesheet" type="text/css" href="assets/css/style.css">

  <script type="module" src="assets/scripts/script.js"></script>
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section mt-2 bg-body p-4 rounded">
      <h2 class="fw-bold">Aggiungi un Libro</h2>
      <form>
        <div class="mb-3">
          <label for="title" class="form-label fw-bold">Titolo</label>
          <input type="text" class="form-control" id="title" aria-describedby="bookTitle">

        </div>
       
        <div class="mb-3">
          <label for="author" class="form-label fw-bold">Autore</label>
          <input type="text" class="form-control" id="author" aria-describedby="bookAuthor">

        </div>
        <div class="mb-3">
          <label for="bookYear" class="form-label fw-bold">Anno</label>
          <input type="number" class="form-control" id="bookYear" aria-describedby="bookYear">

        </div>
        <div class="mb-3">
      <label for="formatBook" class="form-label fw-bold">Formato</label>
      <select id="formatBook" class="form-select">
        <option>Cartaceo</option>
        <option>Digitale</option>
      </select>
    </div>

        <button type="submit" class="btn btn-primary rounded bg-primary py-2 px-4">Aggiungi uno</button>
      </form>

    </section>

    <section class="lista-section mt-4">
      <h2>I tuoi libri(0)</h2>
      <ul id="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>


</body>

</html>
